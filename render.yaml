services:
  - type: web
    name: piston-voice-rag-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GOOGLE_API_KEY
        sync: false
      - key: LIVE_MODEL
        value: gemini-3.8-live
      - key: TEXT_MODEL
        value: gemini-flash-lite-latest
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: VOICE_NAME
        value: Kore
